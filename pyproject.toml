[project]
name = "verification"
version = "0.1.0"
description = "Evidence-first physical AI verification and governance"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0.40,<3",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "z3-solver>=4.14,<6",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["reference", "graphify-out", "knowledge", "web"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]